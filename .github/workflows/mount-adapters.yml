# Cross-platform mount adapter validation (additive, opt-in).
#
# Linux FUSE is the default-on, fully-proven path and is already exercised by
# `test.yml` and mount-gates.sh. This workflow validates the opt-in adapters.
# Windows and macOS adapters exist as feature-gated code but cannot be built
# reliably on GitHub-hosted runners (winfsp-sys/bindgen version skew and macFUSE
# kernel-extension approval), so both are documented as manual-validation-only.

name: Mount Adapters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: mount-adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows WinFsp adapter (manual-validation-only)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Note manual validation
        shell: pwsh
        run: |
          echo "Windows WinFsp adapter is not built in CI."
          echo "winfsp-sys bindgen/libclang version skew and WinFsp SDK requirements"
          echo "cannot be satisfied reliably on the hosted runner. Validate on real"
          echo "Windows hardware with:"
          echo "  cargo build --release --features mount-windows"

  macos:
    name: macOS macFUSE adapter (manual-validation-only)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Note manual validation
        shell: bash
        run: |
          echo "macOS macFUSE adapter is not built in CI."
          echo "macFUSE requires a kernel extension approval that cannot be granted"
          echo "on headless GitHub runners. Validate on real macOS hardware with:"
          echo "  cargo build --release --features mount-macos"
